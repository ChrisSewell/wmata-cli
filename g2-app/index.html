<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>WMATA Transit</title>
    <style>
      /* ER brand dark-theme surface (#232323) + Neutral-200 text (#E5E5E5). */
      html {
        height: 100%;
        background: #232323;
      }
      body {
        margin: 0;
        /* min-height (NOT height:100%) so the page GROWS with its content and
         * the normal document scroller works. A viewport-height-locked body
         * can't be scrolled in iOS WKWebView — which left the companion stuck,
         * unable to scroll once content overflowed (notably right after the
         * soft keyboard dismissed). */
        min-height: 100%;
        background: #232323;
        color: #E5E5E5;
        font: 14px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        -webkit-text-size-adjust: 100%;
        /* NB: deliberately NO touch-action / overscroll-behavior here — the
         * working companion apps in this webview (FlightAware) don't set them,
         * and they can interfere with scroll recovery after the keyboard hides. */
      }
      #app {
        box-sizing: border-box;
        min-height: 100%;
        padding: 24px 18px;
      }
      /* The Even App webview overlays the soft keyboard WITHOUT reliably
       * shrinking the viewport, so viewport tricks alone don't free the scroll.
       * While a field is focused, reserve a screenful of bottom scroll room so
       * the page can always scroll the field clear of the keyboard (see the
       * focusin/focusout handler in companion/settings.ts). Mirrors FlightAware. */
      body.kbd-open {
        padding-bottom: 80vh;
      }
    </style>
  </head>
  <body>
    <div id="app">Loading…</div>
    <script type="module" src="/src/host/main.ts"></script>
  </body>
</html>
